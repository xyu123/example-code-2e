[project]
name = "fluentpython2e"
version = "0.1.0"
description = "Example code for Fluent Python, Second Edition"
requires-python = ">=3.10"
dependencies = [
    # Chapter 8 – coordinates/geohash examples
    "geolib>=1.0.7",
    # Chapter 20 – concurrent HTTP flag downloads
    "httpx>=0.27",
    "tqdm>=4.66",
    # Chapter 21 – async examples
    "curio>=1.6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    # Testing & type-checking
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
